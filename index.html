<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumiar · Central de Documentos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100F0E; --bg2:#171614; --card:#1D1B19; --card2:#242220; --card3:#2B2825;
  --linha:#2E2B27; --linha2:#3C3833;
  --txt:#F6F3ED; --txt2:#C6C0B5; --txt3:#9A9389;
  --gold:#C7A96B; --gold2:#E2C88E; --goldbg:rgba(199,169,107,.12); --campo:#14130F;
  --ok:#7FA87F; --alerta:#C98A5B; --erro:#B96A6A;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --rail:236px;
}
[data-tema="claro"]{
  --bg:#FAF9F6; --bg2:#F2EFE8; --card:#FFFFFF; --card2:#F6F3EC; --card3:#EDE9E0;
  --linha:#E2DED4; --linha2:#D3CDC0;
  --txt:#16140F; --txt2:#4A453C; --txt3:#6B6459;
  --gold:#8a6d3f; --gold2:#6F5730; --goldbg:rgba(138,109,63,.10); --campo:#FFFFFF;
}
[data-tema="claro"] .btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
[data-tema="claro"] .btn.pri:hover{background:var(--gold2);border-color:var(--gold2)}
[data-tema="claro"] .chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
[data-tema="claro"] .av{color:var(--gold)}
[data-tema="claro"] #modal{background:rgba(80,74,64,.35)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:var(--sans);font-weight:300;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
::selection{background:var(--gold);color:#141210}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--linha2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}

/* ---------- barra lateral ---------- */
.rail{background:var(--bg2);border-right:1px solid var(--linha);display:flex;flex-direction:column;min-height:0}
.rail .topo{padding:20px 20px 16px;border-bottom:1px solid var(--linha)}
.mark{font-family:var(--serif);font-size:21px;letter-spacing:.05em;line-height:1}
.mark small{display:block;font-family:var(--sans);font-size:7px;letter-spacing:.32em;
  text-transform:uppercase;color:var(--gold);margin-top:3px;font-weight:400}
.rail nav{padding:12px 12px;flex:1;overflow-y:auto;min-height:0}
.rail .sec{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--txt3);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;border-radius:10px;
  padding:10px 11px;cursor:pointer;color:var(--txt2);text-align:left;transition:background .14s,color .14s}
.nav:hover{background:var(--card);color:var(--txt)}
.nav[aria-current="true"]{background:var(--goldbg);color:var(--gold)}
.nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 17px}
.nav .badge{margin-left:auto;font-size:10.5px;color:var(--txt3);background:var(--card2);border-radius:99px;padding:2px 8px}
.rail .rodape{padding:12px 16px 16px;border-top:1px solid var(--linha);font-size:10.5px;color:var(--txt2)}

/* ---------- área principal ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--linha);
  background:var(--bg);flex-wrap:wrap}
.bar h1{font-family:var(--serif);font-size:22px;font-weight:500;margin:0;flex:0 0 auto}
.bar .sp{flex:1}
.busca{position:relative;flex:1;min-width:180px;max-width:380px}
.busca input{width:100%;border:1px solid var(--linha2);border-radius:11px;padding:10px 12px 10px 36px;
  background:var(--campo);color:var(--txt)}
.busca input:focus{outline:none;border-color:var(--gold)}
.busca svg{position:absolute;left:12px;top:11px;width:15px;height:15px;stroke:var(--txt3);fill:none;stroke-width:1.7}
.conteudo{flex:1;overflow-y:auto;padding:24px;min-height:0}
.vista{max-width:1080px;margin:0 auto}

.menu-btn{display:none;background:none;border:1px solid var(--linha2);border-radius:10px;padding:8px 10px;cursor:pointer}
.menu-btn svg{width:17px;height:17px;stroke:var(--txt);fill:none;stroke-width:1.7;stroke-linecap:round}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:60;transform:translateX(-102%);
    transition:transform .26s cubic-bezier(.22,1,.36,1);box-shadow:0 0 40px rgba(0,0,0,.5)}
  .rail.on{transform:translateX(0)}
  .menu-btn{display:block}
  .conteudo{padding:18px}
  .bar{padding:12px 16px}
}
#veu{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .24s}
#veu.on{opacity:1;pointer-events:auto}

/* ---------- componentes ---------- */
.card{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:20px}
.card + .card{margin-top:16px}
.card h2{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);
  margin:0 0 16px;display:flex;align-items:center;gap:10px}
.card h2::after{content:'';flex:1;height:1px;background:var(--linha)}
.card h3{font-family:var(--serif);font-size:18px;font-weight:500;margin:0 0 8px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linha2);background:var(--card2);
  color:var(--txt);border-radius:11px;padding:11px 16px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--gold);background:var(--card3)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#141210}
.btn.pri:hover{background:var(--gold2);border-color:var(--gold2)}
.btn.perigo:hover{border-color:var(--erro);color:#E4A0A0}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:9px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.acoes{display:flex;gap:9px;flex-wrap:wrap}

label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt2);margin-bottom:6px;font-weight:400}
input:not([type=file]):not([type=checkbox]):not([type=radio]),select,textarea{
  width:100%;border:1px solid var(--linha2);border-radius:10px;padding:11px 12px;
  background:var(--campo);color:var(--txt);-webkit-text-fill-color:var(--txt)}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 60px var(--campo) inset;-webkit-text-fill-color:var(--txt)}
input::placeholder,textarea::placeholder{color:var(--txt3);opacity:1}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{resize:vertical;min-height:90px;line-height:1.65;font-size:13px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.full{grid-column:1/-1}

/* chips de serviço */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12.5px;border:1px solid var(--linha2);background:var(--campo);color:var(--txt);
  border-radius:99px;padding:8px 14px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--gold);color:var(--txt)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#141210}
.chip .x{margin-left:6px;opacity:.6}

/* tabela / lista */
.tabela{width:100%;border-collapse:collapse}
.tabela th{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt3);
  text-align:left;padding:0 12px 10px;font-weight:400}
.tabela td{padding:12px;border-top:1px solid var(--linha);vertical-align:middle}
.tabela tr{cursor:pointer}
.tabela tbody tr:hover td{background:var(--card2)}
.av{width:34px;height:34px;border-radius:50%;background:var(--bg2);border:1px solid var(--linha2);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;color:var(--gold)}
.nome{font-size:14px}
.meta{font-size:12px;color:var(--txt2)}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  border-radius:99px;padding:3px 9px;background:var(--card3);color:var(--txt2);border:1px solid var(--linha)}
.tag.ok{background:rgba(127,168,127,.14);color:#9CC49C}
.tag.g{background:var(--goldbg);color:var(--gold)}

.vazio{text-align:center;padding:44px 20px;color:var(--txt3)}
.vazio .ic{width:44px;height:44px;margin:0 auto 14px;opacity:.35}
.vazio .ic svg{width:44px;height:44px;stroke:var(--txt2);fill:none;stroke-width:1.2}
.vazio .t{font-size:15px;color:var(--txt2);margin-bottom:6px}
.vazio .d{font-size:12.5px}

.drop{display:block;border:1px dashed var(--linha2);background:var(--bg2);border-radius:13px;
  padding:26px 16px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--gold);background:#1C1A16}
.drop .t{font-size:13.5px;margin-bottom:4px}
.drop .d{font-size:11.5px;color:var(--txt3)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;clip:rect(0 0 0 0)}

/* modal */
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(8,7,6,.7);backdrop-filter:blur(6px)}
#modal.on{display:flex}
#modal .cx{background:var(--card);border:1px solid var(--linha2);border-radius:18px;width:100%;max-width:660px;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
#modal .cab{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;border-bottom:1px solid var(--linha)}
#modal .cab h3{font-family:var(--serif);font-size:20px;font-weight:500;margin:0}
#modal .fechar{background:none;border:0;color:var(--txt3);font-size:22px;cursor:pointer;line-height:1;padding:4px 8px}
#modal .fechar:hover{color:var(--txt)}
#modal .corpo{padding:22px;overflow-y:auto}
#modal .pe{padding:16px 22px;border-top:1px solid var(--linha);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:90;
  background:var(--card3);border:1px solid var(--linha2);border-radius:12px;padding:13px 18px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:rgba(127,168,127,.5)}
#toast.erro{border-color:rgba(185,106,106,.5)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.docgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px}
.doccard{border:1px solid var(--linha2);background:var(--bg2);border-radius:13px;padding:16px;
  cursor:pointer;text-align:left;transition:.16s}
.doccard:hover{border-color:var(--gold);background:var(--card2)}
.doccard .t{font-size:14px;display:block;margin-bottom:3px}
.doccard .d{font-size:11.5px;color:var(--txt3);display:block}
.doccard .n{font-size:10px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:8px}

.hist{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--linha)}
.hist .ic{width:30px;height:30px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.hist .ic svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:1.6}
.hist .t{font-size:13.5px}
.hist .m{font-size:11px;color:var(--txt3)}
.hist .btns{margin-left:auto;display:flex;gap:6px}

.dica{font-size:12.5px;color:var(--txt2);margin-top:10px;line-height:1.6}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:18px;cursor:pointer;transition:.16s}
.kpi:hover{border-color:var(--gold);transform:translateY(-1px)}
.kpi .ic{width:34px;height:34px;border-radius:10px;background:var(--goldbg);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi .ic svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1.6}
.kpi .n{font-family:var(--serif);font-size:32px;line-height:1;font-weight:500}
.kpi .r{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);margin-top:7px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.pgrid{grid-template-columns:1fr}}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.leg{display:flex;flex-direction:column;gap:9px;flex:1;min-width:160px}
.leg .i{display:flex;align-items:center;gap:9px;font-size:12.5px}
.leg .pt{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.leg .v{margin-left:auto;color:var(--txt3);font-size:12px}
.barra{margin-bottom:13px}
.barra .lb{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.barra .lb span:last-child{color:var(--txt3)}
.barra .tr{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden}
.barra .tr i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.atalhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
.atalho{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--linha2);
  border-radius:13px;padding:14px 15px;cursor:pointer;text-align:left;transition:.16s}
.atalho:hover{border-color:var(--gold);background:var(--card2)}
.atalho .ic{width:32px;height:32px;border-radius:9px;background:var(--card);display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.atalho .ic svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.6}
.atalho .t{font-size:13.5px}
.atalho .d{font-size:11px;color:var(--txt3)}

/* tema */
.tema{background:none;border:1px solid var(--linha2);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt2)}
.tema:hover{border-color:var(--gold);color:var(--gold)}
.tema svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}

/* pré-visualização */
#prev{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;background:var(--bg)}
#prev.on{display:flex}
#prev .cab{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--linha);flex-wrap:wrap}
#prev .cab .tit{font-family:var(--serif);font-size:20px;font-weight:500}
#prev .cab .sp{flex:1}
#prev .aviso{font-size:11.5px;color:var(--gold);display:none}
#prev.editando .aviso{display:block}
#prev .area{flex:1;overflow-y:auto;padding:26px 16px 60px;background:var(--bg2)}
#prev .papel{width:210mm;max-width:100%;margin:0 auto;background:#fff;color:#161513;border-radius:4px;
  box-shadow:0 12px 40px rgba(0,0,0,.28);padding:16mm 14mm 18mm}
#prev .reguas{max-width:210mm;margin:0 auto 10px;display:flex;justify-content:space-between;
  font-size:10.5px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase}
#prev.editando .papel{outline:2px solid var(--gold);outline-offset:6px}
@media (max-width:640px){#prev .papel{padding:26px 20px}}

.var{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--goldbg);border:1px solid var(--linha2);
  border-radius:6px;padding:3px 7px;color:var(--gold);cursor:pointer;font-weight:400}
</style>
</head>
<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="topo"><div class="mark">Lumiar<small>Retratos</small></div></div>
    <nav id="nav">
      <div class="sec">Visão geral</div>
      <button class="nav" data-v="painel"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Painel</span></button>
      <div class="sec">Cadastro</div>
      <button class="nav" data-v="clientes"><svg viewBox="0 0 24 24"><path d="M16 19v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 19v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg><span>Clientes</span><span class="badge" id="bg-cli">0</span></button>
      <button class="nav" data-v="trabalhos"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg><span>Trabalhos</span><span class="badge" id="bg-tra">0</span></button>
      <button class="nav" data-v="catalogo"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="7" cy="6" r="1"/><circle cx="7" cy="12" r="1"/><circle cx="7" cy="18" r="1"/></svg><span>Serviços</span><span class="badge" id="bg-cat">0</span></button>
      <div class="sec">Documentos</div>
      <button class="nav" data-v="emitir"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6"/></svg><span>Emitir</span></button>
      <button class="nav" data-v="historico"><svg viewBox="0 0 24 24"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg><span>Emitidos</span><span class="badge" id="bg-doc">0</span></button>
      <button class="nav" data-v="modelos"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Modelos</span></button>
      <div class="sec">Sistema</div>
      <button class="nav" data-v="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ajustes</span></button>
    </nav>
    <div class="rodape">Central de Documentos · v1.0</div>
  </aside>

  <main class="main">
    <div class="bar">
      <button class="menu-btn" id="abrirMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

// classifica um produto por palavras-chave do nome, para migrar catálogos antigos
function adivinharSub(nome){
  const n = String(nome||'').toLowerCase();
  if(/quadro|tela|canvas|acr[íi]lic|metacril|parede|gallery|composi/.test(n)) return 'parede';
  if(/[áa]lbum|album|fotolivro|folha|capa|luva|estojo|caixa para/.test(n)) return 'estante';
  if(/folio|caixa de fotograf|porta[- ]?retrato|mini/.test(n)) return 'mesa';
  if(/amplia|lembran|presente/.test(n)) return 'presente';
  if(/pen ?drive|pendrive|usb|arquivo/.test(n)) return 'arquivo';
  return 'outros';
}

<span class="par"><b>§3º</b> Após esse período, a recuperação custa R$ {{taxaReenvio}},00, em até 15 dias, sem garantia. Após 1 ano, o reenvio corresponde a 30% do valor do serviço.</span>

<h2>Cláusula 5ª — Acréscimos e prazo de entrega</h2>
<p>A seleção é ato único. O conjunto escolhido é registrado em <b>Ordem de Serviço</b>, com prazo e valor. Acréscimos podem ser contratados a qualquer tempo por Ordem de Serviço, sem novo contrato.</p>
<div class="destaque"><b>Todo acréscimo é pago antes da produção.</b> A Ordem de Serviço só se torna eficaz com a confirmação do pagamento.</div>
<table><tr><th>Imagens selecionadas</th><th>Prazo de entrega</th></tr>
<tr><td>até {{limiteBase}}</td><td>{{prazoBase}} dias úteis</td></tr>
<tr><td>de {{limiteBase}} a {{limiteMedio}}</td><td>{{prazoMedio}} dias úteis</td></tr>
<tr><td>acima de {{limiteMedio}}</td><td>definido na Ordem de Serviço</td></tr></table>
<span class="par"><b>§1º</b> Edições especiais possuem prazo próprio, somado ao acima.</span>
<span class="par"><b>§2º</b> O prazo conta da conclusão da seleção <b>e</b> da quitação integral, o que ocorrer por último.</span>
<span class="par"><b>§3º</b> Não havendo pagamento dos acréscimos em até {{diasPagarExtras}} dias úteis, estes serão cancelados, e a CONTRATANTE indicará quais imagens permanecem dentro do plano. Sem indicação, a CONTRATADA seleciona por critério técnico e segue com a edição.</span>
<span class="par"><b>§4º</b> Produtos personalizados são feitos sob medida; enviado o pedido ao laboratório, não cabe cancelamento (art. 49, parágrafo único, CDC), ressalvado vício.</span>

<h2>Cláusula 6ª — Produtos físicos</h2>
<p>Produtos inclusos no plano: até {{prazoProdutos}} dias corridos da seleção. Avulsos: prazo informado na contratação.</p>
<span class="par"><b>§1º</b> Diagramação de álbum no estúdio sem custo; remota por aplicativo, R$ {{taxaDiagramacao}},00. Uma rodada de alterações inclusa.</span>
<span class="par"><b>§2º</b> Retirada presencial agendada, em até {{diasRetirada}} dias corridos do aviso. Após, custódia de R$ {{taxaCustodia}},00 por mês.</span>
<span class="par"><b>§3º</b> Vícios aparentes devem ser comunicados em até 90 dias (art. 26, CDC). Pequenas variações de cor e acabamento não configuram vício.</span>

<h2>Cláusula 7ª — Remarcação</h2>
<p>Direito a <b>uma remarcação</b>, por escrito, com antecedência mínima de <b>{{avisoRem}}</b>, conforme disponibilidade. A nova data deve ocorrer em até 90 dias corridos.</p>
<span class="par"><b>§1º</b> Fora do prazo, ou a partir da segunda, fica sujeita à análise e a custo correspondente aos gastos assumidos.</span>
<span class="par"><b>§2º</b> Datas em domingos e feriados: taxa de R$ {{taxaDomingo}},00, destinada à equipe de apoio já comprometida.</span>
<span class="par"><b>§3º</b> Em sessões externas, condições climáticas impeditivas geram remarcação sem custo, cabendo a avaliação técnica à CONTRATADA.</span>

<h2>Cláusula 8ª — Cancelamento</h2>
{{#ensaio}}<table><tr><th>Antecedência do aviso</th><th>Consequência</th></tr>
<tr><td>mais de 15 dias</td><td>crédito integral, válido por 12 meses</td></tr>
<tr><td>entre 15 e 7 dias</td><td>crédito de 50%, válido por 12 meses</td></tr>
<tr><td>menos de 7 dias</td><td>retenção integral do valor de reserva</td></tr></table>{{/ensaio}}
{{#evento}}<table><tr><th>Antecedência do aviso</th><th>Consequência</th></tr>
<tr><td>mais de 60 dias</td><td>crédito integral, válido por 12 meses</td></tr>
<tr><td>entre 60 e 30 dias</td><td>crédito de 50%, válido por 12 meses</td></tr>
<tr><td>menos de 30 dias</td><td>retenção integral do valor de reserva</td></tr></table>{{/evento}}
<div class="nota"><b>Razão desta cláusula.</b> A reserva retira a data da agenda e impede sua oferta a terceiros. Quanto mais cedo o aviso, maior a chance de reaproveitamento — por isso a consequência é proporcional ao momento da comunicação.</div>
<span class="par"><b>§1º</b> O crédito é nominal, intransferível, e seu uso depende da disponibilidade da agenda.</span>
<span class="par"><b>§2º</b> Custos já assumidos, especialmente produtos encomendados, não integram o crédito.</span>
<span class="par"><b>§3º</b> O não comparecimento sem aviso equipara-se ao cancelamento na faixa mais curta.</span>
<div class="destaque"><b>Direito de arrependimento.</b> Sendo a contratação feita inteiramente fora do estabelecimento, a CONTRATANTE poderá desistir em 7 dias corridos da assinatura, com devolução integral (art. 49, CDC).</div>

<h2>Cláusula 9ª — Pontualidade</h2>
<p>O tempo contratado não compreende preparação de cabelo e maquiagem. Havendo atraso, o trabalho ocorre no tempo remanescente. Atraso superior a <b>15 minutos</b> pode ser tratado como não comparecimento.</p>

<h2>Cláusula 10 — Caso fortuito e força maior</h2>
<p>Ocorrendo evento que impeça a realização — problema grave de saúde, acidente, furto de equipamento, desastre natural, calamidade ou determinação de autoridade —, as partes definirão nova data.</p>
<span class="par"><b>§1º</b> Não sendo possível o reagendamento por indisponibilidade da CONTRATADA, os valores serão integralmente restituídos, sem multa.</span>
<span class="par"><b>§2º</b> Impossibilitada a atuação pessoal do fotógrafo, poderá ser indicado substituto de padrão equivalente, com concordância prévia.</span>

<h2>Cláusula 11 — Direitos autorais e licença de uso</h2>
<p>As fotografias são obras protegidas pela Lei nº 9.610/1998. A autoria e os direitos morais permanecem com a CONTRATADA, sendo inalienáveis e irrenunciáveis.</p>
<p>A CONTRATANTE recebe <b>licença de uso pessoal, não exclusiva e por prazo indeterminado</b>, que permite imprimir, ampliar, emoldurar, exibir, presentear e publicar em perfis pessoais.</p>
<p>A licença pessoal não abrange uso comercial, publicitário ou institucional; revenda ou sublicenciamento; nem alteração da obra — recortes que a descaracterizem, filtros, reedição ou modificação por qualquer meio, inclusive por inteligência artificial.</p>
<span class="par"><b>Parágrafo único.</b> O uso comercial depende de licença específica, contratada à parte.</span>

<h2>Cláusula 12 — Estúdio, acompanhantes e animais</h2>
<p>Danos a equipamentos, cenários ou figurinos causados pela CONTRATANTE ou acompanhantes são de sua responsabilidade, correspondendo ao valor efetivo de reparo ou reposição, mediante comprovação documental.</p>
<span class="par"><b>Parágrafo único.</b> Acompanhantes em número compatível com o espaço; supervisão de crianças sempre do adulto responsável. Animais admitidos mediante combinação prévia e taxa de higienização.</span>

<h2>Cláusula 13 — Proteção de dados</h2>
<p>Os dados são tratados conforme a Lei nº 13.709/2018, limitados ao necessário para a execução do contrato, compartilhados apenas com prestadores indispensáveis. Comunicações promocionais dependem de consentimento específico (Anexo II). A CONTRATANTE pode solicitar acesso, correção, portabilidade ou exclusão a qualquer tempo (art. 18).</p>

<h2>Cláusula 14 — Disposições gerais</h2>
<span class="par"><b>§1º</b> Vigora até o cumprimento integral das obrigações.</span>
<span class="par"><b>§2º</b> Alterações somente por termo aditivo assinado.</span>
<span class="par"><b>§3º</b> A tolerância é mera liberalidade e não implica novação.</span>
<span class="par"><b>§4º</b> Válida a assinatura eletrônica, ainda que sem certificado digital (MP 2.200-2/2001, art. 10, §2º).</span>
<span class="par"><b>§5º</b> A CONTRATANTE declara ter recebido o Manual do Cliente, que integra este contrato.</span>

<h2>Cláusula 15 — Foro</h2>
<p>Fica eleito o foro da Comarca de {{cidade}}, <b>ressalvado à CONTRATANTE o direito de propor ação no foro de seu domicílio</b> (art. 101, I, CDC).</p>

function dados(cli, tra, numero){
  const c = DB.config, r = c.regras, t = tra||{};
  const ev = t.categoria === 'evento';
  const tot = num(t.total), sin = num(t.sinal);
  return {
    nome:cli.nome||'', cpf:cli.cpf||'', rg:cli.rg||'', nasc:cli.nasc||'', tel:cli.tel||'',
    email:cli.email||'', endereco:cli.end||'', conheceu:cli.conheceu||'',
    categoria: ev?'Cobertura de evento':'Ensaio fotográfico', nicho:t.nicho||'',
    plano:t.plano||'', qtd:t.qtd||'', data:dbr(t.data)||'____/____/______', hora:t.hora||'',
    local:t.local||'',
    servicos:(()=>{ const l=(t.itens||[]).filter(x=>x.cat==='ensaio'||x.cat==='evento')
        .map(x=>x.nome+(x.qtd>1?' ('+x.qtd+')':'')); return l.length?l.join(' · '):(t.nicho||'—'); })(),
    produtos:(()=>{ const l=(t.itens||[]).filter(x=>x.cat==='produto'||x.cat==='revelacao')
        .map(x=>x.nome+(x.detalhe?' — '+x.detalhe:'')+(x.qtd>1?' ('+x.qtd+')':'')+(x.incluso?' — incluso':'')); return l.length?l.join(' · '):'—'; })(),
    itens:(()=>{ const l=(t.itens||[]); return l.length? l.map(x=>x.nome+(x.detalhe?' — '+x.detalhe:'')+(x.qtd>1?' ×'+x.qtd:'')).join(' · '):'—'; })(),
    itensLista:(()=>{ const l=(t.itens||[]); if(!l.length) return '';
        return '<table><tr><th>Item</th><th>Especificação</th><th style="width:52px;text-align:center">Qtd.</th></tr>'
          + l.map(x=>`<tr><td>${x.nome}</td><td>${x.detalhe||'—'}</td><td style="text-align:center">${x.qtd||1}</td></tr>`).join('')
          + '</table>'; })(),
    total:tot?brl(tot):'______________', sinal:sin?brl(sin):'______________',
    saldo:(tot&&sin)?brl(tot-sin):'______________',
    pct: ev?`${r.sinalEvento}% (cinquenta por cento)`:`${r.sinalEnsaio}% (trinta por cento)`,
    avisoRem: ev?r.remEvento:r.remEnsaio, hoje:dataDoc(), numero:numero||'________',
    empresa:c.empresa.nome, cnpj:c.empresa.cnpj, endEmpresa:c.empresa.end,
    telEmpresa:c.empresa.tel, emailEmpresa:c.empresa.email, banco:c.empresa.banco,
    favorecido:c.empresa.fav, cidade:c.empresa.cidade,
    prazoBase:r.prazoBase, prazoMedio:r.prazoMedio, limiteBase:r.limiteBase, limiteMedio:r.limiteMedio,
    taxaDomingo:r.taxaDomingo, taxaCustodia:r.taxaCustodia, taxaReenvio:r.taxaReenvio,
    taxaDiagramacao:r.taxaDiagramacao, taxaExterno:r.taxaExterno, diasBackup:r.diasBackup,
    diasRetirada:r.diasRetirada, prazoProdutos:r.prazoProdutos, diasPagarExtras:r.diasPagarExtras,
    _ev:ev
  };
}

function render(tpl, d){
  let s = tpl;
  s = s.replace(/\{\{#ensaio\}\}([\s\S]*?)\{\{\/ensaio\}\}/g, d._ev?'':'$1');
  s = s.replace(/\{\{#evento\}\}([\s\S]*?)\{\{\/evento\}\}/g, d._ev?'$1':'');
  s = s.replace(/\{\{#(\w+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, (m,k,c)=> (d[k]&&d[k]!=='—'&&!String(d[k]).startsWith('___')) ? c : '');
  s = s.replace(/\{\{(\w+)\}\}/g, (m,k)=> d[k]!==undefined ? esc(d[k]) : '');
  return s;
}

let PREV = {tipo:null, cli:null, tra:null, numero:null, editando:false, registrado:false};

function imprimir(tipo, cli, tra){
  const m = DB.modelos[tipo] || MOD[tipo];
  const numero = String(DB.seq).padStart(4,'0');
  const d = dados(cli, tra, numero);
  const fonte = (m.blocos && m.blocos.length) ? blocosParaHTML(m.blocos) : (m.tpl || MOD[tipo].tpl);
  const corpo = render(fonte, d);
  const c = DB.config.empresa;

  PREV = {tipo, cli, tra, numero, d, editando:false, registrado:false};
  $('#prevTit').textContent = MOD[tipo].nome + ' · ' + (cli.nome||'');
  $('#prevPapel').innerHTML =
    `<div class="topo"><div class="mk">Lumiar<small>Retratos</small></div><div class="id">nº ${numero} · ${hoje()}</div></div>`
    + corpo
    + `<div class="rod">${esc(c.nome)} · CNPJ ${esc(c.cnpj)} · ${esc(c.end)} · ${esc(c.tel)}</div>`;
  $('#prevPapel').contentEditable = 'false';
  $('#prev').classList.remove('editando');
  $('#prevEditar').textContent = 'Editar';
  $('#prev').classList.add('on');
  $('#prev .area').scrollTop = 0;
  injetaEstiloPapel();
  setTimeout(()=>{
    const alt = $('#prevPapel').scrollHeight, mm = alt/ (document.body.clientWidth ? 1 : 1);
    const pag = Math.max(1, Math.ceil(alt / (297/25.4*96)));
    $('#prevPaginas').textContent = pag + (pag===1?' página':' páginas');
  }, 120);
}

function injetaEstiloPapel(){
  if(document.getElementById('estiloPapel')) return;
  const st = document.createElement('style'); st.id='estiloPapel';
  st.textContent = CSSDOC.replace(/<\/?style>/g,'').replace(/@import[^;]+;/,'')
    .replace(/(^|\})\s*([^@}{]+)\{/g, (m,a,b)=> a + b.split(',').map(x=>'#prevPapel '+x.trim()).join(',') + '{')
    .replace(/#prevPapel body/g,'#prevPapel').replace(/#prevPapel \.pg/g,'#prevPapel')
    .replace(/#prevPapel :root/g,':root');
  document.head.appendChild(st);
}

function registraEmissao(){
  if(PREV.registrado) return;
  DB.docs.unshift({id:uid(), numero:PREV.numero, tipo:PREV.tipo, clienteId:PREV.cli.id,
    trabalhoId:PREV.tra?PREV.tra.id:null, nomeCliente:PREV.cli.nome,
    quando:new Date().toISOString(), dados:PREV.d, html:$('#prevPapel').innerHTML});
  DB.seq++; store.salvar(); atualizaBadges();
  PREV.registrado = true;
}

function assinaturaNoAparelho(){
  const campos = [...$('#prevPapel').querySelectorAll('.assina .c')];
  if(!campos.length) return toast('Este documento não tem campo de assinatura','erro');
  const opts = campos.map((c,i)=>{
    const b = c.querySelector('b');
    return `<button type="button" class="btn" data-campo="${i}" style="justify-content:flex-start">${esc(b?b.textContent:'Campo '+(i+1))}</button>`;
  }).join('');
  modal('Assinar no aparelho', `<p style="margin-top:0">Escolha onde a assinatura será aplicada:</p>
    <div class="docgrid">${opts}</div>`, [{txt:'Cancelar', acao:fecharModal}]);
  document.querySelectorAll('[data-campo]').forEach(b=> b.onclick = ()=> desenhaFirma(Number(b.dataset.campo)));
}

function desenhaFirma(idx){
  modal('Assine com o dedo ou o mouse', `
    <div style="background:#fff;border-radius:12px;padding:10px">
      <canvas id="fc" style="width:100%;height:200px;touch-action:none;display:block"></canvas>
    </div>
    <div class="dica">Assine dentro da área branca. Use o botão limpar se quiser refazer.</div>`, [
    {txt:'Limpar', acao:()=>{ const c=$('#fc'); c.getContext('2d').clearRect(0,0,c.width,c.height); }},
    {txt:'Cancelar', acao:fecharModal},
    {txt:'Aplicar', pri:true, acao:()=>{
      const c = $('#fc');
      const campo = [...$('#prevPapel').querySelectorAll('.assina .c')][idx];
      const antiga = campo.querySelector('img.firma'); if(antiga) antiga.remove();
      const img = document.createElement('img'); img.className='firma'; img.src = c.toDataURL('image/png');
      campo.insertBefore(img, campo.firstChild);
      fecharModal(); toast('Assinatura aplicada','ok');
    }}
  ]);
  const c = $('#fc'), ctx = c.getContext('2d');
  const r = c.getBoundingClientRect();
  c.width = r.width*2; c.height = 200*2; ctx.scale(2,2);
  ctx.lineWidth = 1.8; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#161513';
  let desenhando = false;
  const pos = e => { const b = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e; return {x:t.clientX-b.left, y:t.clientY-b.top}; };
  const ini = e => { desenhando = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); };
  const mov = e => { if(!desenhando) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); };
  const fim = ()=> desenhando = false;
  c.addEventListener('mousedown',ini); c.addEventListener('mousemove',mov);
  addEventListener('mouseup',fim);
  c.addEventListener('touchstart',ini,{passive:false}); c.addEventListener('touchmove',mov,{passive:false});
  c.addEventListener('touchend',fim);
}

function enviarParaAssinar(){
  const cfg = DB.config.assinatura || {};

const CORES = ['#C7A96B','#8FA6C4','#A98FC4','#7FA87F','#C98A5B','#C47F9B','#6FA9A0','#B9A46A','#9B8FC4'];

function donut(dados, total){
  if(!total) return '<div class="meta">Sem dados ainda.</div>';
  const R=54, C=2*Math.PI*R; let off=0;
  const arcos = dados.map((d,i)=>{
    const frac = d.v/total, dash = frac*C;
    const g = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${CORES[i%CORES.length]}" stroke-width="20"
      stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"
      style="transition:stroke-dasharray .6s ease"/>`;
    off += dash; return g;
  }).join('');
  return `<div class="donut">
    <svg width="140" height="140" viewBox="0 0 140 140" style="flex:0 0 140px">
      <circle cx="70" cy="70" r="54" fill="none" stroke="var(--bg2)" stroke-width="20"/>
      ${arcos}
      <text x="70" y="66" text-anchor="middle" fill="var(--txt)" font-family="Cormorant Garamond,serif" font-size="30">${total}</text>
      <text x="70" y="84" text-anchor="middle" fill="var(--txt3)" font-size="8" letter-spacing="1.6">TOTAL</text>
    </svg>
    <div class="leg">${dados.map((d,i)=>`<div class="i">
      <span class="pt" style="background:${CORES[i%CORES.length]}"></span>
      <span>${esc(d.n)}</span><span class="v">${d.v}</span></div>`).join('')}</div></div>`;
}

function barras(dados, total){
  if(!dados.length) return '<div class="meta">Sem dados ainda.</div>';
  const max = Math.max(...dados.map(d=>d.v), 1);
  return dados.map((d,i)=>`<div class="barra">
    <div class="lb"><span>${esc(d.n)}</span><span>${d.v}</span></div>
    <div class="tr"><i style="width:${d.v/max*100}%;background:${CORES[i%CORES.length]}"></i></div></div>`).join('');
}

function configurarEspec(base, cb){
  const g = (base.espec&&base.espec.grupos)||[], inc = base.espec&&base.espec.incremento;
  const html = `
    ${g.map(gr=>`<div style="margin-bottom:14px"><label>${esc(gr.nome)}</label>
      <div class="chips" data-grupo="${gr.id}">${gr.opcoes.map((o,k)=>
        `<button type="button" class="chip" data-op="${gr.id}:${k}" aria-pressed="${k===0}">${esc(o.n)}${o.v?' +R$ '+brl(o.v):''}</button>`).join('')}</div></div>`).join('')}
    ${inc?`<div class="campos" style="grid-template-columns:1fr 1fr;margin-top:6px">
      <div><label>${esc(inc.rotulo)}</label><input type="number" id="cf_qtd" min="${inc.minimo}" value="${inc.minimo}"></div>
      <div><label>Equivale a</label><div id="cf_eq" style="padding:11px 0;font-size:14px"></div></div>
    </div>
    <div class="dica">Mínimo de ${inc.minimo} ${esc(inc.rotulo.toLowerCase())}${inc.valor?` · cada ${esc(inc.rotulo.toLowerCase()).replace(/s$/,'')} extra soma R$ ${brl(inc.valor)}`:''}.</div>`:''}
    <div class="card" style="background:var(--bg2);padding:14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div><div class="meta">Valor calculado</div><div id="cf_val" style="font-family:var(--serif);font-size:26px"></div></div>
      <div style="max-width:60%;text-align:right"><div class="meta" id="cf_desc"></div></div>
    </div>`;
  modal('Configurar · '+base.nome, html, [
    {txt:'Cancelar', acao:fecharModal},
    {txt:'Adicionar', pri:true, acao:()=>{ const r = calcula(); fecharModal(); cb(r); }}
  ]);
  function escolhidas(){
    return g.map(gr=>{
      const b = document.querySelector(`[data-grupo="${gr.id}"] .chip[aria-pressed="true"]`);
      const k = b ? Number(b.dataset.op.split(':')[1]) : 0;
      return {grupo:gr.nome, op:gr.opcoes[k]};
    });
  }
  function calcula(){
    const es = escolhidas();
    let valor = Number(base.valor)||0;
    es.forEach(x=> valor += Number(x.op.v)||0);
    let qtd = inc ? Math.max(inc.minimo, Number(($('#cf_qtd')||{}).value)||inc.minimo) : null;
    if(inc && qtd>inc.minimo) valor += (qtd-inc.minimo)*(Number(inc.valor)||0);
    const partes = es.map(x=>x.op.n);
    if(inc){ const eq = qtd*(inc.fator||1);
      partes.push(`${qtd} ${inc.rotulo.toLowerCase()}${inc.fator>1?` (${eq} ${inc.unidadeCliente})`:''}`); }
    return {valor, detalhe:partes.join(' · '), qtdInc:qtd};
  }
  function atualiza(){
    const r = calcula();
    $('#cf_val').textContent = 'R$ '+brl(r.valor);
    $('#cf_desc').textContent = r.detalhe;
    if(inc && $('#cf_eq')){
      const q = Math.max(inc.minimo, Number($('#cf_qtd').value)||inc.minimo);
      $('#cf_eq').textContent = (q*(inc.fator||1))+' '+inc.unidadeCliente;
    }
  }
  document.querySelectorAll('[data-op]').forEach(b=> b.onclick = ()=>{
    const gid = b.dataset.op.split(':')[0];
    document.querySelectorAll(`[data-grupo="${gid}"] .chip`).forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); atualiza();
  });
  if($('#cf_qtd')) $('#cf_qtd').oninput = atualiza;
  atualiza();
}

      `<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>

    <div><label>Plano</label><input id="t_plano" value="${esc(e.plano||'')}"></div>
    <div><label>Imagens do plano</label><input type="number" id="t_qtd" value="${esc(e.qtd||'')}"></div>
    <div><label>Data</label><input type="date" id="t_data" value="${esc(e.data||'')}"></div>
    <div><label>Horário</label><input id="t_hora" value="${esc(e.hora||'')}" placeholder="14h30"></div>
    <div class="full"><label>Local</label><input id="t_local" value="${esc(e.local||'')}"></div>
    <div><label>Situação</label><select id="t_status">${['Orçamento','Contratado','Fotografado','Em edição','Entregue'].map(x=>
      `<option ${e.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
  </div>

  <h2 style="font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin:22px 0 10px">Itens contratados</h2>
  <div class="campos" style="grid-template-columns:1fr 1fr 1fr">
    <div><label>Categoria</label><select id="t_addCat">${Object.entries(cfg.categorias).map(([k,n])=>
      `<option value="${k}">${n}</option>`).join('')}</select></div>
    <div><label>Item</label><select id="t_addItem"></select></div>
    <div id="t_pacWrap"><label>Pacote</label><select id="t_addPac"></select></div>
  </div>
  <div class="acoes" style="margin-top:10px"><button class="btn sm" id="t_add">${IC.mais}<span>Adicionar item</span></button></div>
  <div id="t_lista" style="margin-top:12px">${itens.map(linhaItem).join('')||'<div class="meta">Nenhum item adicionado.</div>'}</div>

  <div class="campos" style="margin-top:20px">
    <div><label>Valor total (R$)</label><input id="t_total" value="${esc(e.total||'')}"></div>
    <div><label>Reserva (R$)</label><input id="t_sinal" value="${esc(e.sinal||'')}"></div>
  </div>
  <div class="acoes" style="margin-top:10px">
    <button class="btn sm" id="t_somar">Somar itens no total</button>
    <button class="btn sm" id="t_calc">Calcular reserva</button>
  </div>
  <div class="dica">Um trabalho pode reunir ensaio, evento, produtos e revelações ao mesmo tempo. Os valores vêm do catálogo e podem ser ajustados aqui, sem alterar o cadastro.</div>`, [
    ...(t?[{txt:'Excluir', perigo:true, acao:()=>{ fecharModal(); confirmar('Excluir este trabalho?', ()=>{
      DB.trabalhos = DB.trabalhos.filter(x=>x.id!==t.id); store.salvar(); desenha(); toast('Trabalho excluído'); }); }}]:[]),
    {txt:'Cancelar', acao:fecharModal},
    {txt:'Salvar', pri:true, acao:()=>{
      lerLinhas();
      const v = id => $('#t_'+id).value.trim();
      const dados = {clienteId:$('#t_cli').value, categoria:v('cat'), nicho:v('nicho'), plano:v('plano'),
        qtd:v('qtd'), data:v('data'), hora:v('hora'), local:v('local'), total:v('total'), sinal:v('sinal'),
        status:v('status'), itens:itens};
      if(t) Object.assign(t,dados); else DB.trabalhos.push(Object.assign({id:uid()},dados));
      store.salvar(); fecharModal(); desenha(); toast('Trabalho salvo','ok');
    }}
  ]);

  function opcoesItem(){
    const cat = $('#t_addCat').value;
    if(cat==='produto'){
      $('#t_addItem').innerHTML = optsProdutoPorSub() || '<option value="">— nenhum produto —</option>';
    } else {
      $('#t_addItem').innerHTML = (cfg.catalogo||[]).filter(x=>x.cat===cat)
        .map(x=>`<option value="${x.id}">${esc(x.nome)}${(x.pacotes&&x.pacotes.length)?' — '+x.pacotes.length+' pacote(s)':(x.valor?' — R$ '+brl(x.valor):'')}</option>`).join('')
        || '<option value="">— nenhum item nesta categoria —</option>';
    }
    opcoesPac();
  }
  function opcoesPac(){
    const base = (cfg.catalogo||[]).find(x=>x.id===$('#t_addItem').value);
    const pks = base ? (base.pacotes||[]) : [];
    const wrap = $('#t_pacWrap');
    if(pks.length){
      wrap.style.display = '';
      $('#t_addPac').innerHTML = pks.map(p=>`<option value="${p.id}">${esc(p.nome||'(sem nome)')}${p.valor?' — R$ '+brl(p.valor):''}${p.imagens?' · '+p.imagens+' fotos':''}</option>`).join('');
    } else {
      wrap.style.display = 'none';
      $('#t_addPac').innerHTML = '';
    }
  }
  function pinta(){
    $('#t_lista').innerHTML = itens.map(linhaItem).join('') || '<div class="meta">Nenhum item adicionado.</div>';
    document.querySelectorAll('[data-rm]').forEach(b=> b.onclick = ()=>{
      lerLinhas(); const k = itens.findIndex(x=>x.id===b.dataset.rm); if(k>=0) itens.splice(k,1); pinta(); somaTotal(); });
    document.querySelectorAll('[data-cfg]').forEach(b=> b.onclick = ()=>{
      lerLinhas();
      const it = itens.find(x=>x.id===b.dataset.cfg);
      const base = (cfg.catalogo||[]).find(x=>x.id===it.catalogoId);
      if(!base || !base.espec || !((base.espec.grupos||[]).length || base.espec.incremento))
        return toast('Este item não tem especificações cadastradas');
      configurarEspec(base, r=>{ it.valor = r.valor; it.detalhe = r.detalhe; pinta(); somaTotal(); });
    });
  }
  function somaTotal(){
    const soma = itens.reduce((a,x)=>a + (Number(x.valor)||0)*(Number(x.qtd)||1), 0);
    const c = $('#t_total'); if(c) c.value = brl(soma);
  }
  function lerLinhas(){
    itens.forEach(it=>{
      const q = document.querySelector(`[data-q="${it.id}"]`), vl = document.querySelector(`[data-vl="${it.id}"]`);
      if(q) it.qtd = Number(q.value)||1;
      if(vl) it.valor = Number(vl.value)||0;
    });
  }
  $('#t_addCat').onchange = opcoesItem;
  $('#t_addItem').onchange = opcoesPac;
  $('#t_add').onclick = ()=>{
    lerLinhas();
    const base = (cfg.catalogo||[]).find(x=>x.id===$('#t_addItem').value);
    if(!base) return toast('Cadastre itens nesta categoria em Serviços','erro');
    const ehEnsEv = (base.cat==='ensaio'||base.cat==='evento');
    const pkSel = $('#t_addPac');
    const pk = (base.pacotes||[]).find(p=>p.id===(pkSel?pkSel.value:''));
    if(ehEnsEv && (base.pacotes||[]).length && !pk) return toast('Escolha um pacote','erro');

    if(pk){
      itens.push({id:uid(), catalogoId:base.id, cat:base.cat, nome:base.nome+' · '+(pk.nome||'Pacote'),
        qtd:1, valor:pk.valor||0, pacote:pk.nome, imagens:pk.imagens||0});
      (pk.produtos||[]).forEach(p=> itens.push({id:uid(), cat:'produto', nome:p.nome, qtd:p.qtd||1, valor:0, incluso:true}));
      $('#t_nicho').value = base.nome;
      $('#t_cat').value = base.cat==='evento' ? 'evento' : 'ensaio';
      $('#t_plano').value = pk.nome || '';
      if(pk.imagens) $('#t_qtd').value = pk.imagens;
    } else if(base.espec && ((base.espec.grupos||[]).length || base.espec.incremento)){
      configurarEspec(base, r=>{
        itens.push({id:uid(), catalogoId:base.id, cat:base.cat, nome:base.nome, qtd:1,
          valor:r.valor, detalhe:r.detalhe});
        pinta(); somaTotal();
      });
      return;
    } else {
      itens.push({id:uid(), catalogoId:base.id, cat:base.cat, nome:base.nome, qtd:1, valor:base.valor||0});
      if(!$('#t_nicho').value.trim() && ehEnsEv){
        $('#t_nicho').value = base.nome;
        $('#t_cat').value = base.cat==='evento' ? 'evento' : 'ensaio';
      }
    }
    pinta(); somaTotal();
  };
  $('#t_somar').onclick = ()=>{
    lerLinhas();
    const soma = itens.reduce((a,x)=>a + (Number(x.valor)||0)*(Number(x.qtd)||1), 0);
    $('#t_total').value = brl(soma); toast('Total somado','ok');
  };
  $('#t_calc').onclick = ()=>{
    const tot = num($('#t_total').value);
    if(!tot) return toast('Preencha o valor total','erro');
    const pc = $('#t_cat').value==='evento' ? cfg.regras.sinalEvento : cfg.regras.sinalEnsaio;
    $('#t_sinal').value = brl(tot*pc/100);
  };
  opcoesItem(); pinta();
}

let abaCat = 'ensaio', abaSub = 'todas';

// opções de produto agrupadas por subcategoria (para seletores)
function optsProdutoPorSub(){
  const subs = DB.config.subprod || PADRAO.subprod;
  const prods = (DB.config.catalogo||[]).filter(x=>x.cat==='produto');
  let html='';
  Object.entries(subs).forEach(([k,label])=>{
    const items = prods.filter(p=>(p.sub||'outros')===k);
    if(!items.length) return;
    html += `<optgroup label="${esc(label)}">`+items.map(p=>
      `<option value="${p.id}">${esc(p.nome)}${p.valor?' — R$ '+brl(p.valor):''}</option>`).join('')+`</optgroup>`;
  });
  return html;
}
// produtos (agrupados) + revelações, para escolher o que vai incluso num pacote
function optsInclusosPacote(){
  let html = optsProdutoPorSub();
  const revs = (DB.config.catalogo||[]).filter(x=>x.cat==='revelacao');
  if(revs.length) html += `<optgroup label="Revelações">`+revs.map(p=>
    `<option value="${p.id}">${esc(p.nome)}${p.valor?' — R$ '+brl(p.valor):''}</option>`).join('')+`</optgroup>`;
  return html;
}

  let corpo='';
  if(abaCat==='produto'){
    const subKeys = Object.keys(subs).filter(k=> todos.some(x=>x.cat==='produto' && (x.sub||'outros')===k));
    const subChips = `<div class="chips" style="margin-bottom:16px">
      <button class="chip" data-sub="todas" aria-pressed="${abaSub==='todas'}">Todas</button>
      ${subKeys.map(k=>`<button class="chip" data-sub="${k}" aria-pressed="${abaSub===k}">${esc(subs[k])}
        <span style="opacity:.6;margin-left:6px">${todos.filter(x=>x.cat==='produto'&&(x.sub||'outros')===k).length}</span></button>`).join('')}</div>`;
    const mostrar = abaSub==='todas' ? subKeys : [abaSub];
    const grupos = mostrar.map(k=>{
      const items = lista.filter(x=>(x.sub||'outros')===k);
      if(!items.length) return '';
      return `<div style="margin-top:6px"><div style="padding:6px 2px 8px;color:var(--gold);letter-spacing:.2em;font-size:9px;text-transform:uppercase">${esc(subs[k]||k)}</div>${tabelaItens(items)}</div>`;
    }).join('');
    corpo = subChips + (grupos || `<div class="vazio"><div class="t">Nenhum produto aqui</div>
      <div class="d">Adicione um produto e escolha a subcategoria — Parede, Álbuns e estojos, Mesa e mão, Presente ou Arquivo.</div></div>`);
  } else if(abaCat==='ensaio' || abaCat==='evento'){
    corpo = lista.length ? tabelaPacotes(lista)
      : `<div class="vazio"><div class="t">Nenhum item em ${cats[abaCat]}</div>
         <div class="d">Crie o item (ex.: Gestante) e cadastre dentro dele os pacotes Essencial, Intermediário e Avançado.</div></div>`;
  } else {
    corpo = lista.length ? tabelaItens(lista)
      : `<div class="vazio"><div class="t">Nenhum item em ${cats[abaCat]}</div>
         <div class="d">Cadastre os itens desta categoria com nome e valor. Depois é só selecionar no trabalho.</div></div>`;
  }

  let apoio;
  if(abaCat==='ensaio' || abaCat==='evento'){
    apoio = `<div class="card"><h2>Como funciona</h2>
      <p class="dica" style="margin:0">Em ${cats[abaCat].toLowerCase()}, o preço fica dentro dos <b>pacotes</b> de cada item. Clique num item acima (ou crie um novo) e cadastre os pacotes — por exemplo <b>Essencial</b>, <b>Intermediário</b> e <b>Avançado</b> — cada um com preço, número de imagens e os produtos inclusos. Ao montar o trabalho, você escolhe o item e o pacote, e o contrato é preenchido automaticamente.</p></div>`;
  } else {
    const alvo = abaCat==='produto'
      ? todos.filter(x=>x.cat==='produto' && (abaSub==='todas' || (x.sub||'outros')===abaSub))
      : todos.filter(x=>x.cat===abaCat);
    apoio = `<div class="card"><h2>Preenchimento rápido${abaCat==='produto'&&abaSub!=='todas'?' · '+esc(subs[abaSub]):''}</h2>
      <p class="dica" style="margin:0 0 14px">Informe os valores de vários itens de uma vez. Deixe em branco o que ainda não tem preço.</p>
      <div class="campos">${alvo.map(x=>
        `<div><label>${esc(x.nome)}</label><input type="number" step="0.01" data-preco="${x.id}" value="${x.valor||''}" placeholder="0,00"></div>`).join('')}</div>
      ${alvo.length? '<div class="acoes" style="margin-top:16px"><button class="btn pri" id="salvarPrecos">Salvar valores</button></div>':''}</div>`;
  }

  $('#vista').innerHTML = `<div class="card">${abas}${corpo}</div>${apoio}`;

  document.querySelectorAll('[data-aba]').forEach(b=> b.onclick = ()=>{ abaCat=b.dataset.aba; abaSub='todas'; desenha(); });
  document.querySelectorAll('[data-sub]').forEach(b=> b.onclick = ()=>{ abaSub=b.dataset.sub; desenha(); });
  document.querySelectorAll('.tabela tbody tr').forEach(tr=> tr.onclick = ()=>
    formItem((DB.config.catalogo||[]).find(x=>x.id===tr.dataset.id)));
  const sp = $('#salvarPrecos');
  if(sp) sp.onclick = ()=>{
    document.querySelectorAll('[data-preco]').forEach(inp=>{
      const it = DB.config.catalogo.find(x=>x.id===inp.dataset.preco);
      if(it) it.valor = Number(inp.value)||0;
    });
    store.salvar(); desenha(); toast('Valores salvos','ok');
  };
}

function formItem(x){
  const e = x||{cat:abaCat}, cats = DB.config.categorias;
  let pacotes = JSON.parse(JSON.stringify(e.pacotes||[]));

  const prodChip = (pk,p,pi)=>`<span class="chip" aria-pressed="true" style="cursor:default">${esc(p.nome)}${p.qtd>1?' ×'+p.qtd:''}<span class="x" data-rmprod="${pk.id}:${pi}" style="cursor:pointer">×</span></span>`;

  const cardPacote = pk => `<div class="card" data-pac="${pk.id}" style="background:var(--bg2);padding:16px;margin-top:12px">
    <div class="campos" style="grid-template-columns:2fr 1fr 1fr">
      <div><label>Nome do pacote</label><input data-pn="${pk.id}" value="${esc(pk.nome||'')}" placeholder="Essencial, Intermediário…"></div>
      <div><label>Preço (R$)</label><input type="number" step="0.01" data-pv="${pk.id}" value="${pk.valor||''}" placeholder="0,00"></div>
      <div><label>Imagens</label><input type="number" data-pi="${pk.id}" value="${pk.imagens||''}" placeholder="0"></div>
      <div class="full"><label>O que inclui (texto livre)</label><input data-pd="${pk.id}" value="${esc(pk.descricao||'')}" placeholder="ex.: 1 troca de roupa, making of, galeria online…"></div>
    </div>
    <label style="margin-top:12px">Produtos inclusos no pacote</label>
    <div class="chips" style="margin-bottom:10px">${(pk.produtos||[]).length? pk.produtos.map((p,pi)=>prodChip(pk,p,pi)).join('') : '<span class="meta">Nenhum produto adicionado.</span>'}</div>
    <div class="campos" style="grid-template-columns:2fr .7fr auto;align-items:end">
      <div><select data-np="${pk.id}">${optsInclusosPacote()||'<option value="">— cadastre produtos primeiro —</option>'}</select></div>
      <div><input type="number" min="1" data-nq="${pk.id}" value="1" aria-label="Quantidade"></div>
      <div><button type="button" class="btn sm" data-addprod="${pk.id}">${IC.mais}<span>Incluir</span></button></div>
    </div>
    <div class="acoes" style="margin-top:12px"><button type="button" class="btn sm perigo" data-rmpac="${pk.id}">Remover pacote</button></div>
  </div>`;

  modal(x?'Editar item':'Novo item', `<div class="campos">
    <div><label>Categoria</label><select id="i_cat">${Object.entries(cats).map(([k,n])=>
      `<option value="${k}" ${e.cat===k?'selected':''}>${n}</option>`).join('')}</select></div>
    <div id="i_subWrap"><label>Subcategoria</label><select id="i_sub">${Object.entries(DB.config.subprod||PADRAO.subprod).map(([k,l])=>
      `<option value="${k}" ${(e.sub||'outros')===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
    <div><label>Valor avulso (R$)</label><input type="number" step="0.01" id="i_valor" value="${e.valor||''}"></div>
    <div class="full"><label>Nome do item</label><input id="i_nome" value="${esc(e.nome||'')}" placeholder="Gestante, Newborn, Casamento…"></div>
    <div class="full"><label>Observação</label><input id="i_obs" value="${esc(e.obs||'')}" placeholder="tamanho, acabamento, duração…"></div>
  </div>
  <div id="i_especBloco">
    <h2 style="font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin:22px 0 6px">Especificações</h2>
    <p class="dica" style="margin:0 0 10px">Cadastre aqui as opções que o cliente escolhe — tamanho, capa, acabamento, tipo de caixa. Cada opção pode ter acréscimo de valor. Na hora de montar o trabalho, você só clica.</p>
    <div id="i_grupos"></div>
    <div class="acoes" style="margin-top:10px"><button type="button" class="btn sm" id="i_addGrupo">${IC.mais}<span>Novo grupo de opções</span></button></div>
    <div class="card" style="background:var(--bg2);padding:16px;margin-top:14px">
      <label style="margin-bottom:10px">Quantidade variável — lâminas, cópias, fotografias</label>
      <div class="campos" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
        <div><label>Rótulo interno</label><input id="i_incR" placeholder="Lâminas"></div>
        <div><label>Como mostrar ao cliente</label><input id="i_incU" placeholder="páginas"></div>
        <div><label>Multiplicador</label><input type="number" id="i_incF" placeholder="2"></div>
        <div><label>Mínimo incluso</label><input type="number" id="i_incM" placeholder="10"></div>
        <div><label>Valor por unidade extra (R$)</label><input type="number" step="0.01" id="i_incV" placeholder="0,00"></div>
      </div>
      <p class="dica" style="margin-top:8px">Exemplo do álbum: rótulo <b>Lâminas</b>, mostrado como <b>páginas</b>, multiplicador <b>2</b>, mínimo <b>10</b>. O valor avulso cobre as 10 lâminas; cada lâmina além disso soma o valor extra. Deixe o rótulo em branco para desativar.</p>
    </div>
  </div>

  <div id="i_pacotesBloco">
    <h2 style="font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin:22px 0 6px">Pacotes deste item</h2>
    <p class="dica" style="margin:0 0 4px">Crie quantos pacotes quiser (ex.: Essencial, Intermediário, Avançado), cada um com seu preço, número de imagens e os produtos que já vêm inclusos. Ao montar o trabalho, basta escolher o pacote — o contrato preenche tudo sozinho. O <b>valor avulso</b> acima serve só quando o item é vendido fora de pacote.</p>
    <div id="i_pacotes"></div>
    <div class="acoes" style="margin-top:12px">
      <button type="button" class="btn sm" id="i_addPac">${IC.mais}<span>Adicionar pacote</span></button>
      <button type="button" class="btn sm" id="i_modeloPac">Usar modelo: Essencial · Intermediário · Avançado</button>
    </div>
  </div>`, [
    ...(x?[{txt:'Excluir', perigo:true, acao:()=>{ fecharModal(); confirmar('Excluir este item do catálogo?', ()=>{
      DB.config.catalogo = DB.config.catalogo.filter(y=>y.id!==x.id); store.salvar(); desenha(); toast('Item excluído'); }); }}]:[]),
    {txt:'Cancelar', acao:fecharModal},
    {txt:'Salvar', pri:true, acao:()=>{
      lerPacotes();
      const nome = $('#i_nome').value.trim();
      if(!nome) return toast('Informe o nome do item','erro');
      const cat = $('#i_cat').value;
      const dados = {cat, nome, valor:Number($('#i_valor').value)||0, obs:$('#i_obs').value.trim(),
        pacotes: ['ensaio','evento'].includes(cat) ? pacotes.filter(p=>(p.nome||'').trim()) : []};
      if(cat==='produto') dados.sub = $('#i_sub').value;
      dados.espec = lerEspec();
      if(x) Object.assign(x,dados); else DB.config.catalogo.push(Object.assign({id:uid()},dados));
      store.salvar(); fecharModal(); desenha(); toast('Item salvo','ok');
    }}
  ]);

  let grupos = JSON.parse(JSON.stringify((e.espec&&e.espec.grupos)||[]));
  const inc0 = (e.espec&&e.espec.incremento)||{};

  function cardGrupo(g){
    return `<div class="card" data-g="${g.id}" style="background:var(--bg2);padding:14px;margin-top:10px">
      <div class="campos" style="grid-template-columns:1fr auto;align-items:end">
        <div><label>Nome do grupo</label><input data-gn="${g.id}" value="${esc(g.nome||'')}" placeholder="Tamanho, Capa, Acabamento…"></div>
        <div><button type="button" class="btn sm perigo" data-rmg="${g.id}">Remover</button></div>
      </div>
      <label style="margin-top:12px">Opções</label>
      ${(g.opcoes||[]).map((o,k)=>`<div class="campos" style="grid-template-columns:1fr 130px auto;align-items:end;margin-bottom:7px">
        <div><input data-on="${g.id}:${k}" value="${esc(o.n||'')}" placeholder="20×20 cm"></div>
        <div><input type="number" step="0.01" data-ov="${g.id}:${k}" value="${o.v||''}" placeholder="acréscimo"></div>
        <div><button type="button" class="btn sm perigo" data-rmo="${g.id}:${k}">×</button></div>
      </div>`).join('')}
      <button type="button" class="btn sm" data-addo="${g.id}" style="margin-top:4px">${IC.mais}<span>Nova opção</span></button>
    </div>`;
  }
  function lerGrupos(){
    grupos.forEach(g=>{
      const n = document.querySelector(`[data-gn="${g.id}"]`); if(n) g.nome = n.value.trim();
      (g.opcoes||[]).forEach((o,k)=>{
        const a = document.querySelector(`[data-on="${g.id}:${k}"]`), b = document.querySelector(`[data-ov="${g.id}:${k}"]`);
        if(a) o.n = a.value.trim(); if(b) o.v = Number(b.value)||0;
      });
    });
  }
  function pintaGrupos(){
    const box = $('#i_grupos'); if(!box) return;
    box.innerHTML = grupos.length ? grupos.map(cardGrupo).join('')
      : '<div class="meta" style="padding:4px 0">Nenhum grupo ainda. Use o botão abaixo para criar — por exemplo, Tamanho ou Capa.</div>';
    document.querySelectorAll('[data-rmg]').forEach(b=> b.onclick = ()=>{ lerGrupos(); grupos = grupos.filter(g=>g.id!==b.dataset.rmg); pintaGrupos(); });
    document.querySelectorAll('[data-addo]').forEach(b=> b.onclick = ()=>{ lerGrupos();
      const g = grupos.find(x=>x.id===b.dataset.addo); g.opcoes = g.opcoes||[]; g.opcoes.push({n:'',v:0}); pintaGrupos(); });
    document.querySelectorAll('[data-rmo]').forEach(b=> b.onclick = ()=>{ lerGrupos();
      const [gid,k] = b.dataset.rmo.split(':'); const g = grupos.find(x=>x.id===gid);
      g.opcoes.splice(Number(k),1); pintaGrupos(); });
  }
  function lerEspec(){
    lerGrupos();
    const r = $('#i_incR') ? $('#i_incR').value.trim() : '';
    const gs = grupos.filter(g=>(g.nome||'').trim() && (g.opcoes||[]).some(o=>(o.n||'').trim()))
      .map(g=>({id:g.id, nome:g.nome.trim(), opcoes:g.opcoes.filter(o=>(o.n||'').trim())}));
    const inc = r ? {rotulo:r, unidadeCliente:($('#i_incU').value.trim()||r.toLowerCase()),
      fator:Number($('#i_incF').value)||1, minimo:Number($('#i_incM').value)||1,
      valor:Number($('#i_incV').value)||0} : null;
    return (gs.length || inc) ? {grupos:gs, incremento:inc} : null;
  }

  function pinta(){
    $('#i_pacotes').innerHTML = pacotes.length ? pacotes.map(cardPacote).join('')
      : '<div class="meta" style="padding:6px 0">Nenhum pacote ainda. Para itens vendidos como pacote (ensaios e eventos), adicione ao menos um.</div>';
    document.querySelectorAll('[data-rmpac]').forEach(b=> b.onclick = ()=>{ lerPacotes(); pacotes = pacotes.filter(p=>p.id!==b.dataset.rmpac); pinta(); });
    document.querySelectorAll('[data-addprod]').forEach(b=> b.onclick = ()=>{
      lerPacotes();
      const pk = pacotes.find(p=>p.id===b.dataset.addprod); if(!pk) return;
      const sel = document.querySelector(`[data-np="${pk.id}"]`);
      const base = (DB.config.catalogo||[]).find(y=>y.id===(sel&&sel.value));
      if(!base) return toast('Escolha um produto','erro');
      const qtd = Number(document.querySelector(`[data-nq="${pk.id}"]`).value)||1;
      (pk.produtos = pk.produtos||[]).push({nome:base.nome, qtd, catalogoId:base.id});
      pinta();
    });
    document.querySelectorAll('[data-rmprod]').forEach(b=> b.onclick = ()=>{
      lerPacotes();
      const [pid,idx] = b.dataset.rmprod.split(':');
      const pk = pacotes.find(p=>p.id===pid); if(pk && pk.produtos) pk.produtos.splice(Number(idx),1);
      pinta();
    });
  }
  function lerPacotes(){
    pacotes.forEach(pk=>{
      const g = attr => { const el = document.querySelector(`[${attr}="${pk.id}"]`); return el ? el.value : undefined; };
      const n=g('data-pn'); if(n!==undefined) pk.nome=n.trim();
      const v=g('data-pv'); if(v!==undefined) pk.valor=Number(v)||0;
      const i=g('data-pi'); if(i!==undefined) pk.imagens=Number(i)||0;
      const d=g('data-pd'); if(d!==undefined) pk.descricao=d.trim();
    });
  }
  function toggleBloco(){
    const cat = $('#i_cat').value;
    $('#i_pacotesBloco').style.display = ['ensaio','evento'].includes(cat) ? '' : 'none';
    $('#i_subWrap').style.display = cat==='produto' ? '' : 'none';
  }
  $('#i_cat').onchange = toggleBloco;
  pintaGrupos();
  if($('#i_addGrupo')) $('#i_addGrupo').onclick = ()=>{ lerGrupos(); grupos.push({id:uid(),nome:'',opcoes:[{n:'',v:0}]}); pintaGrupos(); };
  if($('#i_incR')){
    $('#i_incR').value = inc0.rotulo||''; $('#i_incU').value = inc0.unidadeCliente||'';
    $('#i_incF').value = inc0.fator||''; $('#i_incM').value = inc0.minimo||''; $('#i_incV').value = inc0.valor||'';
  }
  $('#i_addPac').onclick = ()=>{ lerPacotes(); pacotes.push({id:uid(), nome:'', valor:0, imagens:0, descricao:'', produtos:[]}); pinta(); };
  $('#i_modeloPac').onclick = ()=>{ lerPacotes(); ['Essencial','Intermediário','Avançado'].forEach(n=>
    pacotes.push({id:uid(), nome:n, valor:0, imagens:0, descricao:'', produtos:[]})); pinta(); };
  toggleBloco(); pinta();
}

/* ---------- emitir ---------- */

  <div class="card"><h2>Dados do trabalho</h2>

      <div><label>Plano</label><input id="y_plano" value="${esc(tra.plano||'')}"></div>
      <div><label>Imagens</label><input type="number" id="y_qtd" value="${esc(tra.qtd||'')}"></div>
      <div><label>Data</label><input type="date" id="y_data" value="${esc(tra.data||'')}"></div>

      `<button class="doccard" data-tipo="${k}"><span class="t">${m.nome}</span><span class="d">${m.desc}</span>
       <span class="n">${DB.docs.filter(d=>d.tipo===k&&d.clienteId===cid).length} emitido(s)</span></button>`).join('')}</div>
    <div class="dica">O documento abre em nova aba já formatado, e a janela de impressão aparece em seguida. Escolha “Salvar como PDF” para arquivar.</div>

  $('#e_cli').onchange = ev => { selCliente = DB.clientes.find(c=>c.id===ev.target.value); selTrabalho=null; desenha(); };
  $('#e_tra').onchange = ev => { selTrabalho = ev.target.value||null; desenha(); };
  $('#e_novoTra').onclick = ()=> formTrabalho(null, cid);
  const bt = $('#e_editTra'); if(bt) bt.onclick = ()=> formTrabalho(tra);

  const mapaCli = {nome:'nome',cpf:'cpf',rg:'rg',tel:'tel',nasc:'nasc',email:'email',end:'end'};

    const inp = $('#x_'+campo); if(!inp) return;
    inp.onblur = ()=>{ cli[chave] = inp.value.trim(); store.salvar(); };
  });
  if(tra){
    ['nicho','plano','qtd','data','hora','local','total','sinal'].forEach(campo=>{
      const inp = $('#y_'+campo); if(!inp) return;
      inp.onblur = ()=>{ tra[campo] = inp.value.trim(); store.salvar(); };
    });
  }
  if($('#e_data')){
    $('#e_data').onchange = e => { DATA_DOC = e.target.value || hojeISO(); toast('Data do documento: '+dataDoc()); };
    $('#e_hoje').onclick = ()=>{ DATA_DOC = hojeISO(); $('#e_data').value = DATA_DOC; toast('Data de hoje aplicada','ok'); };
  }
  document.querySelectorAll('.doccard').forEach(b=> b.onclick = ()=>{
    Object.entries(mapaCli).forEach(([campo,chave])=>{ const inp=$('#x_'+campo); if(inp) cli[chave]=inp.value.trim(); });
    if(tra) ['nicho','plano','qtd','data','hora','local','total','sinal'].forEach(campo=>{
      const inp=$('#y_'+campo); if(inp) tra[campo]=inp.value.trim(); });
    store.salvar();
    imprimir(b.dataset.tipo, cli, tra);
  });
}
