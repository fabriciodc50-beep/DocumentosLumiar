/* ---------- editor visual de modelos ---------- */
const TIPOS = {
  titulo:{n:'Título principal', ic:'H'}, subtitulo:{n:'Linha de apoio', ic:'—'},
  secao:{n:'Título de seção', ic:'§'}, subsecao:{n:'Subtítulo', ic:'h'},
  paragrafo:{n:'Parágrafo', ic:'¶'}, par:{n:'Parágrafo destacado', ic:'|'},
  dados:{n:'Bloco de dados', ic:'▤'}, tabela:{n:'Tabela', ic:'▦'},
  lista:{n:'Lista', ic:'•'}, opcao:{n:'Caixa de marcar', ic:'☐'},
  destaque:{n:'Destaque', ic:'★'}, nota:{n:'Observação', ic:'!'},
  assina:{n:'Assinaturas', ic:'✎'}, quebra:{n:'Quebra de página', ic:'⤓'},
  html:{n:'Bloco avançado', ic:'<>'}
};

function htmlParaBlocos(html){
  const doc = new DOMParser().parseFromString('<div id=raiz>'+html+'</div>','text/html');
  const raiz = doc.getElementById('raiz');
  const bs = [];
  [...raiz.children].forEach(n=>{
    const t = n.tagName.toLowerCase(), cl = n.className||'';
    const txt = n.innerHTML.trim();
    if(t==='h1') bs.push({id:uid(),tipo:'titulo',texto:txt});
    else if(t==='p' && cl.includes('sub')) bs.push({id:uid(),tipo:'subtitulo',texto:txt});
    else if(t==='h2') bs.push({id:uid(),tipo:'secao',texto:txt});
    else if(t==='h3') bs.push({id:uid(),tipo:'subsecao',texto:txt});
    else if(t==='p') bs.push({id:uid(),tipo:'paragrafo',texto:txt});
    else if(t==='span' && cl.includes('par')) bs.push({id:uid(),tipo:'par',texto:txt});
    else if(t==='ul') bs.push({id:uid(),tipo:'lista',itens:[...n.querySelectorAll('li')].map(li=>li.innerHTML.trim())});
    else if(t==='table'){
      const linhas = [...n.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.innerHTML.trim()));
      const temTh = n.querySelector('th');
      bs.push({id:uid(),tipo:'tabela',cab:temTh?linhas[0]:[],linhas:temTh?linhas.slice(1):linhas});
    }
    else if(t==='div' && cl.includes('bloco')){
      bs.push({id:uid(),tipo:'dados',linhas:[...n.querySelectorAll('.lin')].map(l=>({
        r:(l.querySelector('.r')||{}).innerHTML||'', v:(l.querySelector('.v')||{}).innerHTML||''}))});
    }
    else if(t==='div' && cl.includes('dupla')){
      [...n.children].forEach(c=>{
        bs.push({id:uid(),tipo:'dados',lado:true,linhas:[...c.querySelectorAll('.lin')].map(l=>({
          r:(l.querySelector('.r')||{}).innerHTML||'', v:(l.querySelector('.v')||{}).innerHTML||''}))});
      });
    }
    else if(t==='div' && cl.includes('destaque')) bs.push({id:uid(),tipo:'destaque',texto:txt});
    else if(t==='div' && cl.includes('nota')) bs.push({id:uid(),tipo:'nota',texto:txt});
    else if(t==='div' && cl.includes('opt')) bs.push({id:uid(),tipo:'opcao',texto:(n.querySelector('span:last-child')||n).innerHTML.trim()});
    else if(t==='div' && cl.includes('assina')){
      const cs = [...n.querySelectorAll('.c')].map(c=>{
        const b = c.querySelector('b'); const rot = b?b.innerHTML.trim():'';
        const cl2 = c.cloneNode(true); const b2 = cl2.querySelector('b'); if(b2) b2.remove();
        return {rot, txt:cl2.innerHTML.trim()};
      });
      bs.push({id:uid(),tipo:'assina',campos:cs});
    }
    else if(t==='div' && (n.getAttribute('style')||'').includes('page-break')) bs.push({id:uid(),tipo:'quebra'});
    else bs.push({id:uid(),tipo:'html',texto:n.outerHTML});
  });
  return bs;
}

function blocosParaHTML(bs){
  const out = [];
  for(let i=0;i<bs.length;i++){
    const b = bs[i];
    switch(b.tipo){
      case 'titulo': out.push(`<h1>${b.texto||''}</h1>`); break;
      case 'subtitulo': out.push(`<p class="sub">${b.texto||''}</p>`); break;
      case 'secao': out.push(`<h2>${b.texto||''}</h2>`); break;
      case 'subsecao': out.push(`<h3>${b.texto||''}</h3>`); break;
      case 'paragrafo': out.push(`<p>${b.texto||''}</p>`); break;
      case 'par': out.push(`<span class="par">${b.texto||''}</span>`); break;
      case 'lista': out.push('<ul>'+(b.itens||[]).map(x=>`<li>${x}</li>`).join('')+'</ul>'); break;
      case 'destaque': out.push(`<div class="destaque">${b.texto||''}</div>`); break;
      case 'nota': out.push(`<div class="nota">${b.texto||''}</div>`); break;
      case 'opcao': out.push(`<div class="opt"><span class="bx"></span><span>${b.texto||''}</span></div>`); break;
      case 'quebra': out.push('<div style="page-break-before:always"></div>'); break;
      case 'html': out.push(b.texto||''); break;
      case 'tabela': {
        const cab = (b.cab||[]).length? '<tr>'+b.cab.map(c=>`<th>${c}</th>`).join('')+'</tr>' : '';
        out.push('<table>'+cab+(b.linhas||[]).map(l=>'<tr>'+l.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</table>');
        break; }
      case 'dados': {
        const corpo = `<div class="bloco">`+(b.linhas||[]).map(l=>
          `<div class="lin"><span class="r">${l.r||''}</span><span class="v">${l.v||''}</span></div>`).join('')+`</div>`;
        if(b.lado && bs[i+1] && bs[i+1].tipo==='dados' && bs[i+1].lado){
          const n2 = bs[i+1];
          const corpo2 = `<div class="bloco">`+(n2.linhas||[]).map(l=>
            `<div class="lin"><span class="r">${l.r||''}</span><span class="v">${l.v||''}</span></div>`).join('')+`</div>`;
          out.push(`<div class="dupla">${corpo}${corpo2}</div>`); i++;
        } else out.push(corpo);
        break; }
      case 'assina':
        out.push('<div class="assina">'+(b.campos||[]).map(c=>
          `<div class="c"><b>${c.rot||''}</b>${c.txt||''}</div>`).join('')+'</div>');
        break;
    }
  }
  return out.join('\n');
}

function editarModelo(k){
  const salvo = DB.modelos[k];
  let blocos = salvo && salvo.blocos ? JSON.parse(JSON.stringify(salvo.blocos))
             : htmlParaBlocos((salvo && salvo.tpl) || MOD[k].tpl);
  let modoCodigo = false;

  const campoTexto = (b, campo, rotulo, alto) => alto
    ? `<textarea data-b="${b.id}" data-f="${campo}" style="min-height:74px">${esc(b[campo]||'')}</textarea>`
    : `<input data-b="${b.id}" data-f="${campo}" value="${esc(b[campo]||'')}" placeholder="${rotulo||''}">`;

  function cardBloco(b, i){
    let corpo = '';
    if(['titulo','subtitulo','secao','subsecao'].includes(b.tipo)) corpo = campoTexto(b,'texto','Texto');
    else if(['paragrafo','par','destaque','nota','opcao'].includes(b.tipo)) corpo = campoTexto(b,'texto','Texto',true);
    else if(b.tipo==='html') corpo = `<textarea data-b="${b.id}" data-f="texto" style="min-height:90px;font-family:ui-monospace,monospace;font-size:11.5px">${esc(b.texto||'')}</textarea>`;
    else if(b.tipo==='lista') corpo = `<textarea data-b="${b.id}" data-f="_itens" style="min-height:80px" placeholder="Um item por linha">${esc((b.itens||[]).join('\n'))}</textarea>`;
    else if(b.tipo==='quebra') corpo = '<div class="meta">O documento continua na página seguinte.</div>';
    else if(b.tipo==='dados') corpo = (b.linhas||[]).map((l,j)=>
        `<div class="campos" style="grid-template-columns:1fr 1fr auto;align-items:end;margin-bottom:6px">
          <div><input data-b="${b.id}" data-f="l:${j}:r" value="${esc(l.r||'')}" placeholder="Rótulo"></div>
          <div><input data-b="${b.id}" data-f="l:${j}:v" value="${esc(l.v||'')}" placeholder="Valor ou {{campo}}"></div>
          <div><button type="button" class="btn sm perigo" data-rml="${b.id}:${j}">×</button></div></div>`).join('')
      + `<button type="button" class="btn sm" data-addl="${b.id}">${IC.mais}<span>Nova linha</span></button>`
      + `<div class="dica" style="margin-top:6px">Marque “lado a lado” para dois blocos ficarem em colunas.
         <label style="display:inline-flex;gap:6px;align-items:center;margin-left:8px;text-transform:none;letter-spacing:0;font-size:12px;color:var(--txt2)">
         <input type="checkbox" data-b="${b.id}" data-f="lado" ${b.lado?'checked':''} style="width:16px;height:16px"> lado a lado</label></div>`;
    else if(b.tipo==='tabela') corpo =
        `<label>Cabeçalho — separe por ponto e vírgula</label>
         <input data-b="${b.id}" data-f="_cab" value="${esc((b.cab||[]).join('; '))}" placeholder="Etapa; Prazo">
         <label style="margin-top:10px">Linhas — uma por linha, colunas separadas por ponto e vírgula</label>
         <textarea data-b="${b.id}" data-f="_linhas" style="min-height:86px">${esc((b.linhas||[]).map(l=>l.join('; ')).join('\n'))}</textarea>`;
    else if(b.tipo==='assina') corpo = (b.campos||[]).map((c,j)=>
        `<div class="campos" style="grid-template-columns:1fr 1fr;margin-bottom:6px">
          <div><input data-b="${b.id}" data-f="c:${j}:rot" value="${esc(c.rot||'')}" placeholder="CONTRATANTE"></div>
          <div><input data-b="${b.id}" data-f="c:${j}:txt" value="${esc(c.txt||'')}" placeholder="{{nome}}"></div></div>`).join('');

    return `<div class="card" data-bloco="${b.id}" style="background:var(--bg2);padding:14px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:${corpo?'10px':'0'}">
        <span class="tag g" style="font-family:var(--serif);font-size:13px;padding:2px 8px">${TIPOS[b.tipo].ic}</span>
        <span style="font-size:13px;flex:1">${TIPOS[b.tipo].n}</span>
        <button type="button" class="btn sm" data-sobe="${b.id}" ${i===0?'disabled':''}>↑</button>
        <button type="button" class="btn sm" data-desce="${b.id}" ${i===blocos.length-1?'disabled':''}>↓</button>
        <button type="button" class="btn sm perigo" data-rmb="${b.id}">×</button>
      </div>${corpo}</div>`;
  }

  function ler(){
    document.querySelectorAll('[data-b]').forEach(el=>{
      const b = blocos.find(x=>x.id===el.dataset.b); if(!b) return;
      const f = el.dataset.f, val = el.type==='checkbox' ? el.checked : el.value;
      if(f==='_itens') b.itens = String(val).split('\n').map(x=>x.trim()).filter(Boolean);
      else if(f==='_cab') b.cab = String(val).split(';').map(x=>x.trim()).filter(Boolean);
      else if(f==='_linhas') b.linhas = String(val).split('\n').filter(x=>x.trim()).map(l=>l.split(';').map(c=>c.trim()));
      else if(f.startsWith('l:')){ const [,j,c] = f.split(':'); b.linhas[j][c] = val; }
      else if(f.startsWith('c:')){ const [,j,c] = f.split(':'); b.campos[j][c] = val; }
      else b[f] = val;
    });
  }

  function pinta(){
    const box = $('#mv_blocos'); if(!box) return;
    box.innerHTML = blocos.map(cardBloco).join('');
    document.querySelectorAll('[data-rmb]').forEach(x=> x.onclick = ()=>{ ler(); blocos = blocos.filter(b=>b.id!==x.dataset.rmb); pinta(); });
    document.querySelectorAll('[data-sobe]').forEach(x=> x.onclick = ()=>{ ler();
      const i = blocos.findIndex(b=>b.id===x.dataset.sobe); if(i>0){ [blocos[i-1],blocos[i]]=[blocos[i],blocos[i-1]]; } pinta(); });
    document.querySelectorAll('[data-desce]').forEach(x=> x.onclick = ()=>{ ler();
      const i = blocos.findIndex(b=>b.id===x.dataset.desce); if(i<blocos.length-1){ [blocos[i+1],blocos[i]]=[blocos[i],blocos[i+1]]; } pinta(); });
    document.querySelectorAll('[data-addl]').forEach(x=> x.onclick = ()=>{ ler();
      const b = blocos.find(y=>y.id===x.dataset.addl); b.linhas = b.linhas||[]; b.linhas.push({r:'',v:''}); pinta(); });
    document.querySelectorAll('[data-rml]').forEach(x=> x.onclick = ()=>{ ler();
      const [id,j] = x.dataset.rml.split(':'); const b = blocos.find(y=>y.id===id); b.linhas.splice(Number(j),1); pinta(); });
    document.querySelectorAll('#mv_blocos input,#mv_blocos textarea').forEach(el=>{
      el.addEventListener('focus', ()=> ULTIMO = el);
    });
  }

  let ULTIMO = null;

  modal('Editar · '+MOD[k].nome, `
    <div class="acoes" style="margin-bottom:12px">
      <button type="button" class="btn sm" id="mv_add">${IC.mais}<span>Adicionar bloco</span></button>
      <button type="button" class="btn sm" id="mv_prev">Pré-visualizar</button>
      <button type="button" class="btn sm" id="mv_cod">Ver código</button>
    </div>
    <label>Campos automáticos — clique para inserir onde o cursor estiver</label>
    <div class="chips" id="mv_vars" style="margin-bottom:14px">${CAMPOS.map(c=>`<span class="var" data-c="${c}">{{${c}}}</span>`).join('')}</div>
    <div id="mv_blocos"></div>
    <div id="mv_codigo" style="display:none">
      <label>HTML do modelo</label>
      <textarea id="mv_tpl" style="min-height:300px;font-family:ui-monospace,monospace;font-size:11.5px"></textarea>
    </div>`, [
    {txt:'Restaurar original', acao:()=>{ delete DB.modelos[k]; store.salvar(); fecharModal(); desenha(); toast('Modelo restaurado','ok'); }},
    {txt:'Cancelar', acao:fecharModal},
    {txt:'Salvar', pri:true, acao:()=>{
      if(modoCodigo){ DB.modelos[k] = {tpl:$('#mv_tpl').value}; }
      else { ler(); DB.modelos[k] = {blocos, tpl:blocosParaHTML(blocos)}; }
      store.salvar(); fecharModal(); desenha(); toast('Modelo salvo','ok'); }}
  ]);

  pinta();

  $('#mv_add').onclick = ()=>{
    ler();
    const menu = Object.entries(TIPOS).filter(([t])=>t!=='html').map(([t,d])=>
      `<button type="button" class="btn" data-novo="${t}" style="justify-content:flex-start">
        <span class="tag g" style="font-family:var(--serif);padding:2px 8px">${d.ic}</span><span>${d.n}</span></button>`).join('');
    const antes = $('#mCorpo').innerHTML;
    modal('Adicionar bloco', `<div class="docgrid">${menu}</div>`, [{txt:'Voltar', acao:()=>{ editarModelo(k); }}]);
    document.querySelectorAll('[data-novo]').forEach(b=> b.onclick = ()=>{
      const t = b.dataset.novo;
      const novoB = {id:uid(), tipo:t};
      if(t==='dados') novoB.linhas = [{r:'',v:''}];
      if(t==='tabela'){ novoB.cab = ['Coluna 1','Coluna 2']; novoB.linhas = [['','']]; }
      if(t==='lista') novoB.itens = [''];
      if(t==='assina') novoB.campos = [{rot:'CONTRATANTE',txt:'{{nome}}'},{rot:'CONTRATADA',txt:'{{empresa}}'}];
      blocos.push(novoB);
      DB._rascunho = blocos; editarModelo(k);
    });
  };

  if(DB._rascunho){ blocos = DB._rascunho; delete DB._rascunho; pinta(); }

  $('#mv_cod').onclick = ()=>{
    modoCodigo = !modoCodigo;
    if(modoCodigo){ ler(); $('#mv_tpl').value = blocosParaHTML(blocos); }
    else { blocos = htmlParaBlocos($('#mv_tpl').value); pinta(); }
    $('#mv_blocos').style.display = modoCodigo?'none':'';
    $('#mv_codigo').style.display = modoCodigo?'':'none';
    $('#mv_vars').style.display = modoCodigo?'':'';
    $('#mv_cod').textContent = modoCodigo?'Voltar aos blocos':'Ver código';
  };

  $('#mv_prev').onclick = ()=>{
    ler();
    const cli = DB.clientes[0] || {nome:'Nome do cliente', cpf:'000.000.000-00'};
    const tra = DB.trabalhos.find(t=>t.clienteId===cli.id);
    const d = dados(cli, tra, '0000');
    const html = render(modoCodigo ? $('#mv_tpl').value : blocosParaHTML(blocos), d);
    const w = window.open('','_blank');
    if(!w) return toast('Libere os pop-ups','erro');
    w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Pré-visualização</title>${CSSDOC}</head><body><div class="pg">${html}</div></body></html>`);
    w.document.close();
  };

  document.querySelectorAll('#mv_vars .var').forEach(v=> v.onclick = ()=>{
    const alvo = ULTIMO || $('#mv_tpl');
    if(!alvo) return toast('Clique antes no campo onde quer inserir');
    const txt = `{{${v.dataset.c}}}`, pos = alvo.selectionStart ?? alvo.value.length;
    alvo.value = alvo.value.slice(0,pos)+txt+alvo.value.slice(alvo.selectionEnd ?? pos);
    alvo.focus(); alvo.selectionStart = alvo.selectionEnd = pos+txt.length;
  });
}

/* ══════════════ IMPORTAÇÃO ══════════════ */
function importar(file){
  const r = new FileReader();
  r.onload = ev => {
    try{
      const wb = XLSX.read(ev.target.result,{type:'array'});
      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      let novos = 0, atualizados = 0;
      linhas.forEach(l=>{
        const g = (...ks)=>{ for(const k of ks) for(const col in l) if(col.toLowerCase().includes(k)) return String(l[col]||'').trim(); return ''; };
        const nome = g('nome completo','nome'); if(!nome) return;
        const cpf = g('cpf');
        const nasc = (()=>{ const d=g('nascimento'); const m=d.match(/(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:d; })();
        const dados = {nome, cpf, rg:g('rg'), tel:g('telefone','celular'),
          email:g('endereço de email','e-mail','email'), end:g('endereço residencial','endereço'),
          nasc, conheceu:g('conheceu')};
        const ex = DB.clientes.find(c=>(c.cpf&&c.cpf===cpf) || c.nome.toLowerCase()===nome.toLowerCase());
        if(ex){ Object.assign(ex,dados); atualizados++; }
        else { DB.clientes.push(Object.assign({id:uid()},dados)); novos++; }
      });
      store.salvar(); desenha();
      toast(`${novos} novo(s) · ${atualizados} atualizado(s)`,'ok');
    }catch(err){ toast('Não consegui ler o arquivo','erro'); }
  };
  r.readAsArrayBuffer(file);
}
$('#arqPlan').onchange = e => { if(e.target.files[0]) importar(e.target.files[0]); e.target.value=''; };
$('#arqBkp').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => { try{
      const d = JSON.parse(ev.target.result);
      if(!d.clientes) throw 0;
      DB = Object.assign({clientes:[],trabalhos:[],docs:[],modelos:{},config:JSON.parse(JSON.stringify(PADRAO)),seq:1}, d);
      store.salvar(); desenha(); toast('Backup importado','ok');
    }catch(x){ toast('Arquivo de backup inválido','erro'); } };
  r.readAsText(f); e.target.value='';
};
